name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ubuntu:
    name: Ubuntu (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glslang шейдеры
            packages: libvulkan-dev libglfw3-dev glslang-tools
            prebuilt: OFF
          - name: prebuilt SPIR-V
            packages: libvulkan-dev libglfw3-dev
            prebuilt: ON
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DKSILA_PREBUILT_SHADERS=${{ matrix.prebuilt }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Preview screenshot
        run: |
          ./build/ksila-preview --out lobby.png
          ./build/ksila-preview --hover 0 --out hover.png
          ./build/ksila-preview --focus 2 --out focus.png
          python3 tools/png_probe.py lobby.png
          python3 tools/png_probe.py hover.png --hover 0
          python3 tools/png_probe.py focus.png --focus 2

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.3.11579264"
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: android-sdk
          key: android-sdk-34-${{ env.NDK_VERSION }}-v1

      - name: Install Android SDK
        run: |
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/ct.zip
            unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" > /dev/null

      - name: Build arm64-v8a
        run: |
          cmake --version | head -1
          cmake -B build-android-arm64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DKSILA_PREBUILT_SHADERS=ON \
            2>&1 | tee build-arm64.log || true
          if ! grep -q "Build files have been written" build-arm64.log; then
            grep -m 10 -iE "error|fatal|not found|CMake Error" build-arm64.log | cut -c1-250 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cmake --build build-android-arm64 -j"$(nproc)" 2>&1 | tee -a build-arm64.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            grep -m 10 -iE "error|fatal|Error [0-9]" build-arm64.log | cut -c1-250 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Build x86_64
        run: |
          cmake -B build-android-x86_64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-24 -DKSILA_PREBUILT_SHADERS=ON \
            2>&1 | tee build-x86_64.log || true
          if ! grep -q "Build files have been written" build-x86_64.log; then
            grep -m 10 -iE "error|fatal|not found|CMake Error" build-x86_64.log | cut -c1-250 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cmake --build build-android-x86_64 -j"$(nproc)" 2>&1 | tee -a build-x86_64.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            grep -m 10 -iE "error|fatal|Error [0-9]" build-x86_64.log | cut -c1-250 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Package APK
        run: |
          SO_ARM64="$(find build-android-arm64 -name libksila.so -print -quit)"
          SO_X86_64="$(find build-android-x86_64 -name libksila.so -print -quit)"
          test -n "$SO_ARM64" && test -n "$SO_X86_64"
          bash tools/package_android_apk.sh --out dist/Ksila-lobby.apk \
            "$SO_ARM64=arm64-v8a" "$SO_X86_64=x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: ksila-apk
          path: dist/Ksila-lobby.apk
