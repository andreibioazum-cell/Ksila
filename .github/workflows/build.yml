name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ubuntu:
    name: Ubuntu (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glslang шейдеры
            packages: libvulkan-dev libglfw3-dev glslang-tools
            prebuilt: OFF
          - name: prebuilt SPIR-V
            packages: libvulkan-dev libglfw3-dev
            prebuilt: ON
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DKSILA_PREBUILT_SHADERS=${{ matrix.prebuilt }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Preview screenshot
        run: |
          ./build/ksila-preview --out lobby.png
          ./build/ksila-preview --hover 0 --out hover.png
          ./build/ksila-preview --focus 2 --out focus.png
          python3 tools/png_probe.py lobby.png
          python3 tools/png_probe.py hover.png --hover 0
          python3 tools/png_probe.py focus.png --focus 2

  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NDK_VERSION: "26.3.11579264"
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: android-sdk
          key: android-sdk-34-${{ env.NDK_VERSION }}-v1

      - name: Install Android SDK
        run: |
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/ct.zip
            unzip -q /tmp/ct.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" > /dev/null

      - name: Build arm64-v8a
        run: |
          set +e
          cmake -B build-android-arm64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DKSILA_PREBUILT_SHADERS=ON \
            2>&1 | tee build-arm64.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            grep -m 10 -iE "error|fatal|not found" build-arm64.log | cut -c1-240 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cmake --build build-android-arm64 -j"$(nproc)" 2>&1 | tee -a build-arm64.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            grep -m 10 -iE "error:|fatal error|Error [0-9]" build-arm64.log | cut -c1-240 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Build x86_64
        run: |
          set +e
          cmake -B build-android-x86_64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-24 -DKSILA_PREBUILT_SHADERS=ON \
            2>&1 | tee build-x86_64.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            grep -m 10 -iE "error|fatal|not found" build-x86_64.log | cut -c1-240 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cmake --build build-android-x86_64 -j"$(nproc)" 2>&1 | tee -a build-x86_64.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            grep -m 10 -iE "error:|fatal error|Error [0-9]" build-x86_64.log | cut -c1-240 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: build-*.log

      - name: Package APK
        run: |
          set +e
          SO_ARM64="$(find build-android-arm64 -name libksila.so -print -quit)"
          SO_X86_64="$(find build-android-x86_64 -name libksila.so -print -quit)"
          if [ -z "$SO_ARM64" ] || [ -z "$SO_X86_64" ]; then
            echo "::error::libksila.so not found in build outputs"
            exit 1
          fi
          bash tools/package_android_apk.sh --out dist/Ksila-lobby.apk \
            "$SO_ARM64=arm64-v8a" "$SO_X86_64=x86_64" 2>&1 | tee package.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            grep -m 10 -iE "error|fatal|not found|missing|failed|denied|usage" package.log | cut -c1-240 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Upload package log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-package-log
          path: package.log

      - uses: actions/upload-artifact@v4
        with:
          name: ksila-apk
          path: dist/Ksila-lobby.apk

      - name: Publish APK to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lobby-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create lobby-latest dist/Ksila-lobby.apk \
            --target "$GITHUB_SHA" \
            --title "Ksila Lobby — Android APK" \
            --notes "Лобби на чистом Vulkan API с кнопками в стиле Godot (Играть / Настройки / Классы).

          Подписан debug-ключом из репозитория. arm64-v8a + x86_64, Android 7.0+ (нужен Vulkan).

          Установка: скачайте APK, откройте на телефоне, разрешите установку из неизвестных источников." \
            --prerelease
