name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ubuntu:
    name: Ubuntu (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: glslang шейдеры
            packages: libvulkan-dev libglfw3-dev glslang-tools
            prebuilt: OFF
          - name: prebuilt SPIR-V
            packages: libvulkan-dev libglfw3-dev
            prebuilt: ON
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DKSILA_PREBUILT_SHADERS=${{ matrix.prebuilt }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Preview screenshot
        run: |
          ./build/ksila-preview --out lobby.png
          ./build/ksila-preview --hover 0 --out hover.png
          ./build/ksila-preview --focus 2 --out focus.png
          python3 tools/png_probe.py lobby.png
          python3 tools/png_probe.py hover.png --hover 0
          python3 tools/png_probe.py focus.png --focus 2

  android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}" > /dev/null

      - name: Build arm64-v8a
        run: |
          cmake -B build-android-arm64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DKSILA_PREBUILT_SHADERS=ON
          cmake --build build-android-arm64 -j"$(nproc)"

      - name: Build x86_64
        run: |
          cmake -B build-android-x86_64 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-24 -DKSILA_PREBUILT_SHADERS=ON
          cmake --build build-android-x86_64 -j"$(nproc)"

      - name: Package APK
        run: |
          SO_ARM64="$(find build-android-arm64 -name libksila.so -print -quit)"
          SO_X86_64="$(find build-android-x86_64 -name libksila.so -print -quit)"
          test -n "$SO_ARM64" && test -n "$SO_X86_64"
          bash tools/package_android_apk.sh --out dist/Ksila-lobby.apk \
            "$SO_ARM64=arm64-v8a" "$SO_X86_64=x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: ksila-apk
          path: dist/Ksila-lobby.apk
