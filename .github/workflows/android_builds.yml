name: 🤖 Android Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes

jobs:
  build-android:
    runs-on: ubuntu-24.04
    name: Editor Debug APK (target=editor, arch=arm64)
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: android-editor
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Swappy
        shell: sh
        id: swappy_sdk
        run: |
          if python ./misc/scripts/install_swappy_android.py; then
            echo "SWAPPY_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Swappy installation failed, building without Swappy support."
            echo "SWAPPY_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Perfetto
        shell: sh
        id: perfetto_sdk
        run: |
          if python ./misc/scripts/install_perfetto.py; then
            echo "PROFILER_ENABLED=perfetto" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Perfetto installation failed, building without Perfetto support."
            echo "PROFILER_ENABLED=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} arch=arm64 production=yes profiler=${{ steps.perfetto_sdk.outputs.PROFILER_ENABLED }} swappy=${{ steps.swappy_sdk.outputs.SWAPPY_ENABLED }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
          platform: android
          target: editor

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: android-editor
        continue-on-error: true

      # Builds the single debug APK (android_editor-android-debug.apk).
      # No AAB bundles and no VR (HorizonOS / PicoOS) variants are built.
      - name: Generate Godot editor debug APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          ls -l bin/android_editor_builds/

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: android-editor-debug-apk
          path: bin/android_editor_builds/*.apk
